name: build 
on:
  workflow_dispatch:


# 执行任务
jobs:
  build:
    # 运行环境：用最新Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 步骤1：把代码下载到虚拟机
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：设置JDK环境（Android/Java必需）
      - name: 配置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 步骤3：赋予gradlew执行权限（Linux必需！）
      - name: 赋予构建脚本权限
        run: chmod +x gradlew

      # 步骤4：执行构建！
      - name: 构建项目
        run: ./gradlew assembleDebug

      # 步骤5：上传生成的APK（构建完直接在网页下载！）
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 编译输出-APK
          path: app/build/outputs/apk/debug/*.apk
